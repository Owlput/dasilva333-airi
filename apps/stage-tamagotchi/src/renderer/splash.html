<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AIRI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      .splash-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100vw;
        height: 100vh;
        border-radius: 24px;
        border: 1px solid rgba(226, 232, 240, 0.85);
        background:
          radial-gradient(circle at 12% 14%, rgba(186, 230, 253, 0.45) 0%, transparent 35%),
          radial-gradient(circle at 88% 14%, rgba(221, 214, 254, 0.45) 0%, transparent 35%),
          radial-gradient(circle at 12% 86%, rgba(251, 207, 232, 0.35) 0%, transparent 40%),
          radial-gradient(circle at 88% 86%, rgba(199, 210, 254, 0.4) 0%, transparent 40%),
          radial-gradient(circle at 50% 30%, #ffffff 0%, #f6fafe 70%, #ebf3fb 100%);
        box-shadow: 0 20px 48px rgba(15, 23, 42, 0.08), 0 8px 24px rgba(148, 163, 184, 0.12);
        transition: opacity 0.3s ease, transform 0.3s ease;
        -webkit-app-region: drag;
        overflow: hidden;
      }

      .splash-card.exiting {
        opacity: 0;
        transform: scale(0.97);
      }

      /* macOS Traffic Light Window Controls */
      .window-controls {
        -webkit-app-region: no-drag;
        position: absolute;
        top: 16px;
        left: 18px;
        display: flex;
        align-items: center;
        gap: 7px;
        z-index: 30;
      }

      .control-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 0.5px solid rgba(0, 0, 0, 0.12);
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      .control-dot:hover {
        filter: brightness(0.92);
        transform: scale(1.08);
      }

      .control-dot.close {
        background: #ff5f56;
      }

      .control-dot.min {
        background: #ffbd2e;
      }

      .control-dot.max {
        background: #27c93f;
      }

      /* Corner Sparkle Stars */
      .sparkle {
        position: absolute;
        pointer-events: none;
        z-index: 5;
        animation: sparkle-float 3.4s ease-in-out infinite alternate;
      }

      .sparkle-tl {
        top: 60px;
        left: 72px;
        width: 16px;
        height: 16px;
        color: #7dd3fc;
      }

      .sparkle-tr {
        top: 64px;
        right: 72px;
        width: 16px;
        height: 16px;
        color: #c084fc;
        animation-delay: -1.2s;
      }

      .sparkle-bl {
        bottom: 120px;
        left: 48px;
        width: 14px;
        height: 14px;
        color: #f472b6;
        animation-delay: -2.1s;
      }

      .sparkle-br {
        bottom: 96px;
        right: 56px;
        width: 15px;
        height: 15px;
        color: #93c5fd;
        animation-delay: -0.7s;
      }

      @keyframes sparkle-float {
        0% {
          transform: scale(0.85) rotate(0deg);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.15) rotate(90deg);
          opacity: 0.95;
        }
        100% {
          transform: scale(0.9) rotate(180deg);
          opacity: 0.6;
        }
      }

      /* Brand Area */
      .brand-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 52px;
      }

      .logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        height: 84px;
        animation: airi-gentle-bob 3.2s ease-in-out infinite alternate;
      }

      .logo-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        mix-blend-mode: multiply;
        filter: drop-shadow(0 4px 12px rgba(186, 230, 253, 0.4));
      }

      @keyframes airi-gentle-bob {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-4px);
        }
      }

      .app-title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.38em;
        color: #1e293b;
        margin-top: 14px;
        margin-left: 0.38em; /* optical centering for letter-spacing */
      }

      /* Hero Section */
      .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-top: 20px;
        padding: 0 24px;
      }

      .hero-title {
        font-size: 21px;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.015em;
        line-height: 1.25;
      }

      .hero-subtitle {
        font-size: 13.5px;
        font-weight: 400;
        color: #64748b;
        margin-top: 6px;
      }

      /* Floating Milestone Progress Card */
      .milestone-card {
        -webkit-app-region: no-drag;
        width: 340px;
        border-radius: 18px;
        padding: 16px 18px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(226, 232, 240, 0.85);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 8px 24px rgba(148, 163, 184, 0.08), 0 1px 3px rgba(0, 0, 0, 0.03);
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .card-info {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .icon-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: #e0f2fe;
        color: #0284c7;
        flex-shrink: 0;
        transition: background 0.25s ease, color 0.25s ease;
      }

      .icon-badge svg {
        width: 22px;
        height: 22px;
      }

      .milestone-label {
        font-size: 14px;
        font-weight: 600;
        color: #0f172a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 200px;
      }

      .progress-percent {
        font-size: 14px;
        font-weight: 500;
        color: #64748b;
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
      }

      .progress-track {
        width: 100%;
        height: 7px;
        border-radius: 9999px;
        background: #e2e8f0;
        overflow: hidden;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #38bdf8, #0ea5e9);
        transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .sub-hint {
        font-size: 12px;
        color: #94a3b8;
        font-weight: 400;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Error Zone */
      .error-zone {
        display: none;
        flex-direction: column;
        gap: 10px;
        padding-top: 4px;
      }

      .error-zone.visible {
        display: flex;
      }

      .error-banner {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        border-radius: 10px;
        padding: 8px 10px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        font-size: 12px;
      }

      .error-banner svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        margin-top: 1px;
      }

      .error-details-box {
        max-height: 60px;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10.5px;
        color: #b91c1c;
        margin-top: 4px;
        word-break: break-word;
      }

      .btn-action-group {
        display: flex;
        gap: 8px;
        margin-top: 2px;
      }

      .btn-primary {
        flex: 1;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 500;
        border-radius: 8px;
        border: none;
        background: #0284c7;
        color: white;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .btn-primary:hover {
        background: #0369a1;
      }

      .btn-secondary {
        flex: 1;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 500;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #334155;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .btn-secondary:hover {
        background: #f1f5f9;
      }

      /* Footer */
      .version-footer {
        margin-top: auto;
        margin-bottom: 18px;
        font-size: 11.5px;
        color: #94a3b8;
        letter-spacing: 0.02em;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="splash-card" class="splash-card">
      <!-- Traffic Light Window Controls -->
      <div class="window-controls">
        <div id="btn-close-window" class="control-dot close" title="Close AIRI"></div>
        <div class="control-dot min"></div>
        <div class="control-dot max"></div>
      </div>

      <!-- Atmospheric Sparkles -->
      <svg class="sparkle sparkle-tl" viewBox="0 0 20 20" fill="currentColor">
        <path d="M 10 0 C 10 5.5, 14.5 10, 20 10 C 14.5 10, 10 14.5, 10 20 C 10 14.5, 5.5 10, 0 10 C 5.5 10, 10 5.5, 10 0 Z" />
      </svg>
      <svg class="sparkle sparkle-tr" viewBox="0 0 20 20" fill="currentColor">
        <path d="M 10 0 C 10 5.5, 14.5 10, 20 10 C 14.5 10, 10 14.5, 10 20 C 10 14.5, 5.5 10, 0 10 C 5.5 10, 10 5.5, 10 0 Z" />
      </svg>
      <svg class="sparkle sparkle-bl" viewBox="0 0 20 20" fill="currentColor">
        <path d="M 10 0 C 10 5.5, 14.5 10, 20 10 C 14.5 10, 10 14.5, 10 20 C 10 14.5, 5.5 10, 0 10 C 5.5 10, 10 5.5, 10 0 Z" />
      </svg>
      <svg class="sparkle sparkle-br" viewBox="0 0 20 20" fill="currentColor">
        <path d="M 10 0 C 10 5.5, 14.5 10, 20 10 C 14.5 10, 10 14.5, 10 20 C 10 14.5, 5.5 10, 0 10 C 5.5 10, 10 5.5, 10 0 Z" />
      </svg>

      <!-- Brand Area -->
      <div class="brand-section">
        <div class="logo-container">
          <img
            id="logo-img"
            class="logo-img"
            src="./assets/splash/pastel-tiles.png"
            alt="AIRI"
          />
        </div>
        <div class="app-title">A I R I</div>
      </div>

      <!-- Hero Heading -->
      <div class="hero-section">
        <h1 class="hero-title">Getting your companion ready</h1>
        <p class="hero-subtitle">A moment to settle in.</p>
      </div>

      <!-- Milestone Card -->
      <div class="milestone-card">
        <div class="card-header">
          <div class="card-info">
            <div id="icon-badge" class="icon-badge">
              <!-- Default Character User Icon -->
              <svg id="icon-current" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div id="milestone-label" class="milestone-label">Loading your character</div>
          </div>
          <div id="progress-percent" class="progress-percent">0%</div>
        </div>

        <div class="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="sub-hint" class="sub-hint">Preparing the stage</div>

        <!-- Error State Inside Card -->
        <div id="error-zone" class="error-zone">
          <div class="error-banner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <div>
              <div id="error-msg" style="font-weight: 600;">Startup issue detected</div>
              <div id="error-details" class="error-details-box"></div>
            </div>
          </div>
          <div class="btn-action-group">
            <button id="btn-retry" class="btn-primary">Retry</button>
            <button id="btn-skip-avatar" class="btn-secondary" style="display: none;">Continue without avatar</button>
          </div>
        </div>
      </div>

      <!-- Footer Version -->
      <div id="version-footer" class="version-footer">v0.9.38 · stable</div>
    </div>
    <script type="module" src="/splash.main.ts"></script>
  </body>
</html>
