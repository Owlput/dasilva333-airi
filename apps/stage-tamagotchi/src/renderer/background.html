<!--
  The shared background window's document (D11, §4.1).

  It hosts driver code that a manager asked a renderer for, so it loads the model-driver adapter and nothing
  else: no `App.vue`, no router, no Pinia. Beat sync keeps its own window and its own entry.
-->
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Model drivers - AIRI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, viewport-fit=cover" />
  </head>

  <body style="margin: 0; padding: 0; width: 100%; height: 100%; background: transparent;">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: sans-serif; font-size: 12px; opacity: 0.5;">
      AIRI model driver host (background window). This window is hidden by design; open DevTools from the
      Control Strip's developer menu to inspect it.
    </div>
    <script type="module" src="/background.main.ts"></script>
  </body>
</html>
