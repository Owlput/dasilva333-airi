<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AIRI Sticker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .sticker-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        perspective: 800px;
        padding: 12px;
      }

      .sticker-wrapper {
        position: relative;
        cursor: pointer;
        transform: rotate(var(--tilt, -3.5deg));
        transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.22s ease;
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      .sticker-wrapper:hover {
        transform: rotate(calc(var(--tilt, -3.5deg) + 2deg)) scale(1.04);
        filter: drop-shadow(0 16px 36px rgba(0, 0, 0, 0.32));
      }

      .sticker-img {
        display: block;
        max-width: 90%;
        max-height: 90%;
        object-fit: contain;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.24));
        pointer-events: none;
        opacity: 0;
        transform: scale(0.92);
        transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .sticker-img.loaded {
        opacity: 1;
        transform: scale(1);
      }

      /* Tactile Paper-Peeling Physics Animation */
      .peeling {
        animation: peel-off 0.32s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
        pointer-events: none;
      }

      @keyframes peel-off {
        0% {
          transform: scale(1) rotate(var(--tilt, -3.5deg));
          opacity: 1;
        }
        35% {
          transform: scale(1.06) rotate(calc(var(--tilt, -3.5deg) - 6deg)) translateY(-8px);
          opacity: 0.95;
        }
        100% {
          transform: scale(0.72) rotate(calc(var(--tilt, -3.5deg) + 20deg)) translateY(-45px);
          opacity: 0;
        }
      }

      /* Subtle corner peel hint indicator on hover */
      .peel-hint {
        position: absolute;
        bottom: 8px;
        right: 8px;
        width: 22px;
        height: 22px;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
        color: rgba(255, 255, 255, 0.9);
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
      }

      .sticker-wrapper:hover .peel-hint {
        opacity: 0.85;
        transform: translate(-2px, -2px);
      }

      /* Small loading indicator */
      .loading-spinner {
        position: absolute;
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="sticker-container">
      <div id="sticker-wrapper" class="sticker-wrapper" title="Tap to peel off sticker">
        <div id="loading-spinner" class="loading-spinner"></div>
        <img id="sticker-img" class="sticker-img" alt="Sticker" />
        <svg class="peel-hint" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 19H9c0-5.523 4.477-10 10-10v10z" opacity="0.4" />
          <path d="M19 9c-5.523 0-10 4.477-10 10h10V9z" />
        </svg>
      </div>
    </div>
    <script type="module" src="/sticker.main.ts"></script>
  </body>
</html>
